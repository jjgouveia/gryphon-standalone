[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gryphon"
version = "0.0.1"
description = "Local-first knowledge graph for token-efficient code review through MCP and CLI (fork of code-review-graph)"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
# Original author of the upstream project this fork derives from
# (tirth8205/code-review-graph, MIT).
authors = [
    { name = "Tirth Kanani" },
]
maintainers = [
    { name = "Jarbas Gouveia", email = "gouvik.dev@gmail.com" },
]
keywords = ["code-review", "knowledge-graph", "tree-sitter", "mcp", "ai-coding-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0.0,<3",
    # fastmcp >=3.2.4 is required for Message-based prompts and includes the
    # CVE-2025-62800/62801/66416 fixes; <4 prevents the next major release
    # from breaking the server the way fastmcp 3.0 did. See: #488
    "fastmcp>=3.2.4,<4",
    "tree-sitter>=0.26.0,<1",
    "tree-sitter-language-pack>=0.3.0,<1",
    "pyyaml>=6.0,<7",
    "networkx>=3.2,<4",
    "watchdog>=4.0.0,<7",
    "tomli>=2.0.0,<3; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/jjgouveia/gryphon-standalone"
Repository = "https://github.com/jjgouveia/gryphon-standalone"
Documentation = "https://github.com/jjgouveia/gryphon-standalone/blob/main/docs/INDEX.md"
Changelog = "https://github.com/jjgouveia/gryphon-standalone/blob/main/CHANGELOG.md"
Issues = "https://github.com/jjgouveia/gryphon-standalone/issues"
"Upstream project" = "https://github.com/tirth8205/code-review-graph"

[project.scripts]
gryphon = "gryphon.cli:main"
gryphon-daemon = "gryphon.daemon_cli:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0,<7",
    "numpy>=1.26,<3",
]
google-embeddings = [
    "google-genai>=1.0.0,<3",
]
communities = [
    "igraph>=0.11.0",
]
eval = [
    "matplotlib>=3.7.0",
]
wiki = [
    "ollama>=0.1.0",
]
all = [
    "gryphon[embeddings]",
    "gryphon[google-embeddings]",
    "gryphon[communities]",
    "gryphon[enrichment]",
    "gryphon[eval]",
    "gryphon[wiki]",
]
enrichment = [
    "jedi>=0.19.2",
]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.0,<8",
    "ruff>=0.3.0,<1",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["gryphon"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "gryphon/_bundled_skills"

[tool.hatch.build.targets.sdist]
include = [
    "gryphon/",
    "skills/",
    "docs/",
    "hooks/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
# Hatch adds readme- and licence-named files from anywhere in the tree on top
# of `include`, which pulled the issue tracker's hooks and the VS Code
# extension's own README and LICENSE into the source distribution. (Hatchling
# always ships `.gitignore`; that one cannot be excluded.)
exclude = [
    ".beads/",
    "gryphon-vscode/",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "diagrams/",  # diagram DSL scripts — intentionally compact, non-standard style
    "tests/fixtures/sample_databricks_notebook.ipynb",  # SQL/R/Scala cells are not valid Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"gryphon/visualization.py" = ["E501"]  # embedded HTML/JS template
"gryphon/savings_dashboard.py" = ["E501"]  # embedded HTML/JS template
"gryphon/_legacy_instructions.py" = ["E501"]  # verbatim past output, must not be reflowed
"tests/fixtures/sample_databricks_export.py" = ["F841", "W292"]  # intentional fixture patterns
"tests/fixtures/sample_notebook.ipynb" = ["F401", "I001"]  # fixture imports: intentionally unused, split across cells
"tests/test_multilang.py" = ["E501"]  # long assertions with explanatory comments

[tool.bandit]
# B101: assert used (fine in non-security code)
# B404: import subprocess (we need git interaction)
# B603: subprocess without shell=True (we use list args, not shell)
# B607: partial executable path (calling "git" by name is standard)
# B608: SQL f-string — false positive, we use parameterized "?" placeholders on a local SQLite DB
skips = ["B101", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
    "e2e: end-to-end tests that spawn the MCP server or CLI as a real subprocess",
]
